# Single-VM production stack (e.g. Oracle Cloud Always Free): PostgreSQL + server + Caddy (automatic HTTPS).
# Run from the repository root:
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up --build -d
name: universal-knowledge-mcp-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ukm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
      POSTGRES_DB: knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukm -d knowledge"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ..
    # Set by .github/workflows/deploy.yml (UKM_IMAGE in .env); without it a local build is used.
    image: ${UKM_IMAGE:-universal-knowledge-mcp:prod}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ukm:${POSTGRES_PASSWORD}@db:5432/knowledge
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      MCP_AUTH_USER_ID: ${MCP_AUTH_USER_ID:-owner}
      MCP_AUTH_ORG_ID: ${MCP_AUTH_ORG_ID:-default}
      KNOWLEDGE_NAMESPACE: ${KNOWLEDGE_NAMESPACE:-default}
      DEFAULT_VISIBILITY: ${DEFAULT_VISIBILITY:-private}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_SERVER_PORT: "3000"
      AUTO_MIGRATE: "true"
      TRUST_PROXY: "true"
      REQUIRE_HTTPS: "true"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      UKM_DOMAIN: ${UKM_DOMAIN:?Set UKM_DOMAIN (your DNS name) in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
