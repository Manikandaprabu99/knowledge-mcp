name: Deploy

# After CI passes on main: build an amd64 + arm64 image, push it to GitHub Container Registry,
# then update the VM over SSH. Enable by setting the repository variable DEPLOY_ENABLED=true.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
        run: |
          reason=""
          if [ "${DEPLOY_ENABLED,,}" != "true" ]; then
            reason="repository variable DEPLOY_ENABLED is '${DEPLOY_ENABLED}'. Add DEPLOY_ENABLED=true under Settings > Secrets and variables > Actions > Variables > Repository variables"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            reason="manual deploys run only from main (this run used $REF)"
          elif [ "$EVENT" = "workflow_run" ] && [ "$CI_CONCLUSION" != "success" ]; then
            reason="CI finished with '$CI_CONCLUSION'"
          elif [ "$EVENT" = "workflow_run" ] && [ "$CI_EVENT" != "push" ]; then
            reason="CI was triggered by '$CI_EVENT', not a push"
          elif [ "$EVENT" = "workflow_run" ] && [ "${CI_REPO,,}" != "${REPO,,}" ]; then
            reason="CI ran for another repository ($CI_REPO)"
          fi
          if [ -n "$reason" ]; then
            echo "::notice title=Deploy skipped::$reason"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build image and deploy to the VM
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/DEPLOYMENT.md)"
            exit 1
          fi

      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=sha-${SOURCE_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Values travel on stdin (not the remote command line), followed by the deploy script.
          {
            printf 'export UKM_IMAGE=%q SOURCE_SHA=%q GHCR_USER=%q GHCR_TOKEN=%q APP_DIR=%q\n' \
              "$IMAGE:$TAG" "$SOURCE_SHA" "$GITHUB_ACTOR" "$GHCR_TOKEN" "${DEPLOY_PATH:-}"
            cat deploy/remote-deploy.sh
          } | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s'